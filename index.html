<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171717"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="description" content="霧中的臺灣：以1958年臺灣為背景的歷史文字RPG。"><title>霧中的臺灣｜歷史文字 RPG</title><link rel="stylesheet" href="style.css?v=4.2"></head><body>
<main class="app-shell"><header class="topbar"><div><p class="eyebrow">HISTORICAL TEXT RPG</p><h1>霧中的臺灣</h1></div><button id="menuBtn" class="icon-btn">☰</button></header>
<section id="startScreen" class="screen"><div class="hero-card paper-card"><p class="date-mark">1958・臺灣</p><h2>在時代的縫隙裡，做出自己的選擇。</h2><p>你不是歷史課本裡的大人物。你的身分會改變你注意到的事情、別人如何看待你，以及某些事件中能做出的選擇。</p><p class="note">歷史題材虛構作品。主要人物與情節為創作，制度與社會背景參考史實；「史實節點」會另外標示並由玩家自行展開。</p></div><label class="field"><span>角色姓名</span><input id="nameInput" maxlength="12" placeholder="例如：林志明"></label><div class="section-label">選擇角色身分</div><div class="identity-grid" id="backgroundChoices">
<button class="bg-choice" data-bg="student"><strong>學生</strong><span>觀察 +2・知識 +2</span><em>求知｜閱讀、校園與學術場合會注意到額外資訊。</em><small>學生證・袖珍筆記本</small></button><button class="bg-choice" data-bg="worker"><strong>工人</strong><span>沉著 +2・人情 +2</span><em>同袍｜面對工人與勞動現場時較容易建立信任。</em><small>舊工作手套・工廠餐券</small></button><button class="bg-choice" data-bg="clerk"><strong>公務員</strong><span>知識 +1・沉著 +1・人情 +2</span><em>熟悉體制｜較能讀懂行政、公文與制度留下的訊息。</em><small>鋼筆・公文袋</small></button><button class="bg-choice" data-bg="reporter"><strong>記者</strong><span>觀察 +2・知識 +1・人情 +1</span><em>新聞嗅覺｜容易察覺可追查的消息，但有些人會因此更戒備。</em><small>記者筆記・相機</small></button><button class="bg-choice" data-bg="teacher"><strong>教師</strong><span>知識 +2・人情 +2</span><em>為人師表｜學生、家長與部分知識分子更願意和你談話。</em><small>教職證明・缺頁字典</small></button><button class="bg-choice" data-bg="merchant"><strong>商人</strong><span>沉著 +1・人情 +3</span><em>生意人｜市場、價格與帳目相關事件會有不同切入點。</em><small>商用帳本・零錢包</small></button><button class="bg-choice" data-bg="veteran"><strong>退伍軍人</strong><span>觀察 +1・沉著 +3</span><em>戰地經驗｜面對戰事消息與突發緊張時較能保持鎮定。</em><small>舊軍用背包・退伍證明</small></button><button class="bg-choice" data-bg="homemaker"><strong>持家者</strong><span>觀察 +1・沉著 +1・人情 +2</span><em>街坊消息｜市場、鄰里與家庭場合容易聽見被忽略的日常資訊。</em><small>家庭帳簿・布提袋</small></button></div><button id="startBtn" class="primary" disabled>開始新遊戲</button><button id="loadStartBtn" class="secondary">讀取此裝置存檔</button></section>
<section id="gameScreen" class="screen hidden"><div class="status-panel"><div class="identity"><div><strong id="playerName">—</strong><small id="playerBg">—</small></div><small id="passiveName" class="passive-chip">—</small></div><div class="stat-row"><span>壓力<b id="stress">0</b></span><span>聲望<b id="rep">0</b></span><span>疑心<b id="suspicion">0</b></span></div></div><div id="attributeBar" class="attribute-bar"></div><div class="location-strip"><span id="chapter">第一章</span><span id="location">臺北</span></div><article class="story-card paper-card"><p id="sceneDate" class="date-mark"></p><h2 id="sceneTitle"></h2><div id="sceneText" class="story-text"></div></article><div id="choices" class="choices"></div><div class="quick-actions"><button id="saveBtn">保存</button><button id="inventoryBtn">行囊</button><button id="logBtn">紀錄</button><button id="restartBtn">重來</button></div><section id="inventoryPanel" class="log-panel hidden"><div class="panel-title-row"><h3>行囊與裝備</h3><button id="closeInventoryBtn">關閉</button></div><div id="equipmentList"></div><div id="inventoryList" class="inventory-list"></div></section><section id="logPanel" class="log-panel hidden"><div class="panel-title-row"><h3>事件紀錄</h3><button id="closeLogBtn">關閉</button></div><div id="logList" class="log-list"></div></section></section><section id="endingScreen" class="screen hidden"><div class="ending-card paper-card"><p class="eyebrow">THE END</p><h2 id="endingTitle"></h2><p id="endingText"></p><div id="endingStats" class="ending-stats"></div><button id="againBtn" class="primary">重新體驗</button></div></section></main><div id="toast" class="toast"></div><aside id="menu" class="drawer hidden"><div class="drawer-head"><h2>遊戲選單</h2><button id="menuClose" class="icon-btn">×</button></div><button id="menuSave">保存目前進度</button><button id="menuLoad">讀取進度</button><button id="menuRestart">重新開始</button><p>存檔只保存在目前裝置的瀏覽器。</p></aside><div id="backdrop" class="backdrop hidden"></div><script src="game-v4.js?v=4.1"></script><script src="role-narrative-v1.js?v=1.1"></script><script src="role-narrative-v2.js?v=2.0"></script><script src="choice-bridges-v2.js?v=2.1"></script><script src="logic-audit-v1.js?v=1.0"></script><script src="history.js?v=2"></script><script src="chapter-expansion-v2.js?v=2.0"></script><script src="narrative-state-v1.js?v=1.0"></script><script src="tension-visuals-v1.js?v=1.1"></script></body></html>
