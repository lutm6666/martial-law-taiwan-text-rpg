<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171717"><meta name="apple-mobile-web-app-capable" content="yes"><title>霧中的臺灣｜歷史文字 RPG</title><link rel="stylesheet" href="style.css"></head><body>
<main class="app-shell"><header class="topbar"><div><p class="eyebrow">HISTORICAL TEXT RPG</p><h1>霧中的臺灣</h1></div><button id="menuBtn" class="icon-btn">☰</button></header>
<section id="startScreen" class="screen"><div class="hero-card paper-card"><p class="date-mark">1958・臺灣</p><h2>在時代的縫隙裡，做出自己的選擇。</h2><p>你不是歷史課本裡的大人物。你只是普通人，而每個看似微小的決定，都可能在日後留下痕跡。</p><p class="note">歷史題材虛構作品。主要人物與情節為創作，制度與社會背景參考史實；作品不替任何政治立場背書。</p></div><label class="field"><span>角色姓名</span><input id="nameInput" maxlength="12" placeholder="例如：林志明"></label><div class="section-label">選擇背景</div><div class="choice-grid" id="backgroundChoices"><button class="bg-choice" data-bg="student"><strong>學生</strong><span>觀察 +2・知識 +2</span></button><button class="bg-choice" data-bg="worker"><strong>工人</strong><span>沉著 +2・人情 +2</span></button><button class="bg-choice" data-bg="clerk"><strong>職員</strong><span>觀察 +1・人情 +3</span></button></div><button id="startBtn" class="primary" disabled>開始新遊戲</button><button id="loadStartBtn" class="secondary">讀取此裝置存檔</button></section>
<section id="gameScreen" class="screen hidden"><div class="status-panel"><div class="identity"><strong id="playerName">—</strong><small id="playerBg">—</small></div><div class="stat-row"><span>壓力<b id="stress">0</b></span><span>聲望<b id="rep">0</b></span><span>疑心<b id="suspicion">0</b></span></div></div><div id="attributeBar" class="attribute-bar"></div><div class="location-strip"><span id="chapter">第一章</span><span id="location">臺北</span></div><article class="story-card paper-card"><p id="sceneDate" class="date-mark"></p><h2 id="sceneTitle"></h2><div id="sceneText" class="story-text"></div></article><div id="choices" class="choices"></div><div class="quick-actions"><button id="saveBtn">保存</button><button id="inventoryBtn">行囊</button><button id="logBtn">紀錄</button><button id="restartBtn">重來</button></div><section id="inventoryPanel" class="log-panel hidden"><div class="panel-title-row"><h3>行囊與裝備</h3><button id="closeInventoryBtn">關閉</button></div><div id="equipmentList"></div><div id="inventoryList" class="inventory-list"></div></section><section id="logPanel" class="log-panel hidden"><div class="panel-title-row"><h3>事件紀錄</h3><button id="closeLogBtn">關閉</button></div><div id="logList" class="log-list"></div></section></section>
<section id="endingScreen" class="screen hidden"><div class="ending-card paper-card"><p class="eyebrow">THE END</p><h2 id="endingTitle"></h2><p id="endingText"></p><div id="endingStats" class="ending-stats"></div><button id="againBtn" class="primary">重新體驗</button></div></section></main><div id="toast" class="toast"></div><aside id="menu" class="drawer hidden"><div class="drawer-head"><h2>遊戲選單</h2><button id="menuClose" class="icon-btn">×</button></div><button id="menuSave">保存目前進度</button><button id="menuLoad">讀取進度</button><button id="menuRestart">重新開始</button><p>存檔只保存在目前裝置的瀏覽器。</p></aside><div id="backdrop" class="backdrop hidden"></div><script src="app.js"></script></body></html>
