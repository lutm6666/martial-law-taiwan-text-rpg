<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RUNNING Case3 Production Smoke</title></head>
<body><pre id="result">RUNNING</pre><iframe id="game" title="Production game" style="width:100%;height:844px;border:0"></iframe>
<script>
(async function(){
 'use strict';
 var mobile=new URLSearchParams(location.search).get('mobile')==='1';
 var frame=document.getElementById('game');
 if(mobile)frame.style.width='390px';
 var out=[],errors=[],doc,game,storage,firstSave=JSON.stringify({caseId:'case1',schema:7,name:'閱讀測試',location:'tea',evidence:['archive_pages','consent_note','waste_route','zhou_motive','wrapped_scrap','postal_stub'],people:['achuan','zhou'],flags:{openingSeen:true},focus:4,deductionStep:0}),secondSave='{"probe":"case2"}';
 // This fixture is run in a disposable test origin/profile.
 localStorage.clear();
 localStorage.setItem('mist-taiwan-case-save-v4',firstSave);
 localStorage.setItem('mist-taiwan-rain-canon-v1',secondSave);
 function ok(cond,msg){if(!cond)throw new Error(msg);out.push('PASS '+msg)}
 function q(sel){return doc.querySelector(sel)}
 function click(sel){var el=q(sel);if(!el)throw new Error('missing '+sel);el.click();return el}
 function action(id){game.scrollTo(0,300);var b=click('[data-action="'+id+'"]');ok(game.scrollY===0,'new action starts at reading origin: '+id);return b}
 function go(id){click('[data-view="map"]');game.scrollTo(0,70);var mapY=game.scrollY;var b=click('[data-go="'+id+'"]');ok(game.scrollY===0,'new location starts at reading origin: '+id);click('[data-view="map"]');ok(Math.abs(game.scrollY-mapY)<=2,'travel retains map reading position: '+id);click('[data-view="scene"]');return b}
 function readingRoundTrip(win,d,nav,recordValue,deductionValue,label){
  function press(value){var b=d.querySelector(nav+'[data-'+(nav.indexOf('data-tab')>=0?'tab':'view')+'="'+value+'"]');if(!b)throw new Error('missing reading tab '+value);b.click();return b}
  press(deductionValue);win.scrollTo(0,120);var questionY=win.scrollY;
  press(recordValue);win.scrollTo(0,700);var recordsY=win.scrollY;
  ok(recordsY>100,label+' has a scrollable acquired record list');
  press(deductionValue);
  ok(Math.abs(win.scrollY-questionY)<=2,label+' restores question reading position');
  press(recordValue);
  ok(Math.abs(win.scrollY-recordsY)<=2,label+' restores record reading position');
  ok(d.documentElement.scrollWidth<=win.innerWidth+1,label+' records do not overflow horizontally');
  win.scrollTo(0,d.documentElement.scrollHeight);
  var cards=d.querySelectorAll(label==='Case 1'?'#evidenceGrid .evidence-card':label==='Case 2'?'.c2-record':'.c3-record');
  var bottom=cards[cards.length-1].getBoundingClientRect().bottom,navTop=d.querySelector(nav).closest('nav').getBoundingClientRect().top;
  ok(bottom<=navTop+1,label+' final record clears fixed navigation');
 }
 function mobileLayout(label){
  if(!mobile)return;
  ok(doc.documentElement.scrollWidth<=game.innerWidth+1,label+' no horizontal overflow');
  Array.from(doc.querySelectorAll('.c3-hypothesis-btn')).forEach(el=>ok(el.getBoundingClientRect().height>=44,label+' hypothesis tap target'));
  Array.from(doc.querySelectorAll('[data-hypothesis-text]')).forEach(el=>ok(parseFloat(game.getComputedStyle(el).fontSize)>=16,label+' input avoids small-font focus zoom'));
  Array.from(doc.querySelectorAll('#case3Production button')).filter(el=>el.offsetParent!==null).forEach(el=>{
   var r=el.getBoundingClientRect();ok(r.left>=-1&&r.right<=game.innerWidth+1,label+' button inside viewport');
  });
 }
 async function waitFor(fn){for(var i=0;i<100;i++){if(fn())return;await new Promise(r=>setTimeout(r,50))}throw new Error('production load timed out')}
 function runFlow(){
  try{
   ok(!!q('#case3ProductionRoot'),'production mount');
   ok(!!q('[data-opening-next]')&&!q('[data-action]'),'opening shown before investigation');
   mobileLayout('prologue');
   click('[data-opening-next]');
   ok(Array.from(doc.querySelectorAll('.c3-tabs button')).map(x=>x.textContent).join('｜')==='調查｜地圖｜紀錄｜推理','Case 3 uses common four tabs');
   ok(game.getComputedStyle(q('.c3-tabs')).position==='fixed','Case 3 navigation fixed');
   click('[data-view="deduction"]');
   ok(!q('[data-start-deduction]')&&!doc.body.textContent.includes('秀蓮最終詢問'),'locked deduction does not reveal later leads');
   click('[data-view="scene"]');
   ok(!!q('[data-action="studio_opening"]'),'opening action visible');
   mobileLayout('opening');
   action('studio_opening');
   ok(!q('.c3-intro')&&!!q('.c3-story'),'result replaces scene introduction');
   mobileLayout('post-opening');
   go('newsstand');
   ok(!!q('.c3-intro')&&!q('.c3-story'),'travel restores location introduction');
   ok(!q('[data-action="newsstand_xiulian"]'),'newsstand follow-up gated before photo');
   action('newsstand_visit');
   ok(!!q('[data-action="newsstand_xiulian"]'),'newsstand follow-up unlocks after photo');
   action('newsstand_xiulian');
   go('studio');action('studio_b084_ledger');
   go('darkroom');action('darkroom_workflow');
   go('alley');action('alley_frames');
   mobileLayout('frame-analysis');
   ok(!q('img[src="assets/case3/frames/frame-13.webp"]'),'F13 art hidden before verification');
   click('[data-view="records"]');click('[data-record-filter="H"]');
   ok(!q('[data-hypothesis-create="H_XIULIAN"]'),'Xiulian hypothesis stays gated');
   click('[data-hypothesis-create="H_SIDE_DOOR"]');
   ok(!q('[data-hypothesis-review]'),'review waits for new evidence');
   mobileLayout('hypothesis-created');
   click('[data-view="scene"]');
   click('[data-frame="personMovement"]');
   click('[data-frame="movingObject"]');
   click('[data-frame="fixedBackground"]');
   ok(doc.body.textContent.indexOf('相關調查結論已寫入紀錄')>=0,'frame comparison completes');
   mobileLayout('frame-analysis-complete');
   click('[data-view="records"]');click('[data-record-filter="H"]');
   q('[data-hypothesis-text="H_SIDE_DOOR"]').value='側門本身不能證明秘密行動。';
   click('[data-hypothesis-review="H_SIDE_DOOR"][data-decision="revised"]');
   ok(doc.body.textContent.includes('最初想法：側門可能代表刻意避開他人視線。'),'hypothesis keeps original text');
   click('[data-hypothesis-review="H_SIDE_DOOR"][data-decision="withdrawn"]');
   ok(doc.body.textContent.includes('已撤回'),'player can withdraw hypothesis');
   mobileLayout('hypothesis-reviewed');
   go('supplier');action('supplier_trace');
   go('studio');action('studio_receiving');
   go('chen_home');action('chen_first');
   go('studio');action('studio_duty');action('studio_loose_procedure');action('studio_loose_search');
   ok(doc.body.textContent.indexOf('舊零片中的單格負片')>=0,'E10 remains neutral before verification');
   action('studio_verify_e10');
   click('[data-view="records"]');click('[data-record-filter="E"]');
   ok(doc.body.textContent.indexOf('A-217 第 13 格原片')>=0,'E10 renames after verification');
   ok(doc.querySelectorAll('.c3-evidence-art').length>0,'evidence art renders in records');
   mobileLayout('evidence-records');
   go('chen_home');action('chen_final');
   click('[data-view="deduction"]');
   ok(!!q('[data-start-deduction]'),'deduction gate unlocks');
   mobileLayout('deduction-ready');
   click('[data-start-deduction]');
   click('[data-view="records"]');click('[data-record-filter="E"]');
   readingRoundTrip(game,doc,'.c3-tabs [data-view]','records','deduction','Case 3');
   ok(doc.activeElement===q('[data-view="records"]'),'Case 3 restored tab keeps keyboard focus');
   ok(q('[data-view="scene"]').disabled&&parseFloat(game.getComputedStyle(q('[data-view="scene"]')).opacity)<.6,'Case 3 paused navigation visibly disabled');
   ok(doc.body.textContent.includes('查證後按「推理」回到原題'),'Case 3 record page explains paused navigation');
   var evidenceY=game.scrollY;click('[data-record-filter="C"]');game.scrollTo(0,60);var conclusionY=game.scrollY;
   click('[data-record-filter="E"]');ok(Math.abs(game.scrollY-evidenceY)<=2,'Case 3 record category restores its own position');
   click('[data-record-filter="C"]');ok(Math.abs(game.scrollY-conclusionY)<=2,'Case 3 conclusion category restores its own position');
   click('[data-record-filter="E"]');
   click('[data-view="records"]');
   ok(!!q('.c3-record-tabs'),'deduction allows reviewing acquired records');
   click('[data-view="deduction"]');
   ok(!!q('[data-deduction-option="q1_b"]'),'return to deduction retains question');
   click('[data-deduction-option="q1_a"]');
   ok(!!q('[data-deduction-option="q1_b"]')&&doc.body.textContent.includes('3/4'),'wrong answer stays on same question and costs focus');
   ['q1_b','q2_a','q3_b','q4_a','q5_a','q6_a'].forEach(function(id){click('[data-deduction-option="'+id+'"]')});
   ok(q('.c3-ending-name')&&q('.c3-ending-name').textContent.indexOf('證據邊界')>=0,'correct ending renders');
   ok(doc.body.textContent.indexOf('照片本身不能證明紙袋內容或秘密活動')>=0,'ending preserves image evidence boundary');
   ok(doc.body.textContent.indexOf('不足以指定唯一的傳言源頭')>=0,'ending preserves rumor-source uncertainty');
   mobileLayout('ending');
   ok(storage.getItem('mist-taiwan-case-save-v4')===firstSave,'Case 1 save unchanged');
   ok(storage.getItem('mist-taiwan-rain-canon-v1')===secondSave,'Case 2 save unchanged');
   ok(errors.length===0,'no browser JavaScript errors');
   return {ok:true,text:out.join('\n')};
  }catch(e){
   return {ok:false,text:out.join('\n')+'\nFAIL '+e.message+'\n'+errors.join('\n')};
  }
 }

 try{
  await new Promise(resolve=>{frame.onload=resolve;frame.src='../_site/index.html'});
  game=frame.contentWindow;doc=frame.contentDocument;storage=game.localStorage;
  game.addEventListener('error',event=>errors.push(event.message||'resource load error'),true);
  await waitFor(()=>q('#casePickerSelect'));
  // Keep entry probes in separate disposable frames. Repeated reloads in a
  // single fixture consume Chrome's virtual-time budget before lazy scripts settle.
  click('#startBtn');
  ok(!!q('#case1OpeningNext')&&!q('#gameScreen:not(.hidden)'),'Case 1 prologue before investigation');
  click('#case1OpeningNext');
  ok(Array.from(doc.querySelectorAll('#gameScreen .tabs button')).map(x=>x.textContent).join('｜')==='調查｜地圖｜紀錄｜推理','Case 1 common four tabs');
  ok(game.getComputedStyle(q('#gameScreen .tabs')).position==='fixed','Case 1 navigation fixed');
  storage.setItem('mist-taiwan-case-save-v4',firstSave);click('#loadBtn');
  click('[data-tab="deduction"]');
  var inference=Array.from(doc.querySelectorAll('#deductionBox button')).find(b=>b.textContent.includes('混入廢紙捆'));inference.click();
  ok(q('#deductionBox h2').textContent==='提出證物','Case 1 correct inference opens evidence stage');
  readingRoundTrip(game,doc,'.tab-btn[data-tab]','record','deduction','Case 1');
  click('[data-tab="deduction"]');
  ok(q('#deductionBox h2').textContent==='提出證物','Case 1 record review retains evidence stage');
  var evidenceButtons=Array.from(doc.querySelectorAll('#deductionBox button'));
  evidenceButtons.find(b=>b.textContent.includes('三頁失落筆記')).click();
  ok(q('#deductionBox h2').textContent==='提出證物'&&!!q('#deductionBox .feedback'),'Case 1 wrong evidence stays at stage with feedback');
  evidenceButtons=Array.from(doc.querySelectorAll('#deductionBox button'));
  evidenceButtons.find(b=>b.textContent.includes('廢紙去向')).click();
  ok(q('#deductionBox h2').textContent.includes('第二問'),'Case 1 correct evidence advances one question');
  storage.setItem('mist-taiwan-case-save-v4',firstSave);
  var probe=document.createElement('iframe');probe.title='Case 2 entry probe';document.body.appendChild(probe);
  await new Promise(resolve=>{probe.onload=resolve;probe.src='../_site/index.html'});
  var pd=probe.contentDocument,pg=probe.contentWindow;
  await waitFor(()=>pd.querySelector('#casePickerSelect'));
  pd.querySelector('#casePickerSelect').value='case2';pd.querySelector('#casePickerGo').click();
  await waitFor(()=>pd.querySelector('#c2OpeningNext'));
  ok(!!pd.querySelector('.case-opening.paper'),'Case 2 shares opening format');pd.querySelector('#c2OpeningNext').click();
  ok(Array.from(pd.querySelectorAll('.c2-tabs button')).map(x=>x.textContent).join('｜')==='調查｜地圖｜紀錄｜推理','Case 2 common four tabs');
  ok(pg.getComputedStyle(pd.querySelector('.c2-tabs')).position==='fixed','Case 2 navigation fixed');
  pd.querySelector('[data-view="deduction"]').click();
  ok(!pd.querySelector('#c2StartDeduction')&&pd.body.textContent.includes('尚未具備結案條件'),'Case 2 deduction gate remains locked');
  pd.querySelector('[data-view="scene"]').click();
  pd.querySelector('[data-action="inspect_footprints"]').click();
  pd.querySelector('[data-action="inspect_yue_mark"]').click();
  pd.querySelector('[data-view="map"]').click();pg.scrollTo(0,70);var rainMapY=pg.scrollY;
  pd.querySelector('.c2-map [data-go]:not(:disabled)').click();
  ok(pg.scrollY===0,'Case 2 travel starts a fresh scene');
  pd.querySelector('[data-view="map"]').click();
  ok(Math.abs(pg.scrollY-rainMapY)<=2,'Case 2 travel retains map reading position');
  // Seed an independently validated deduction save in this disposable profile.
  storage.setItem('mist-taiwan-rain-canon-v1',JSON.stringify({caseId:pg.CASE2_RAIN_CANON.id,name:'閱讀測試',loc:'home',visited:{home:true},evidence:Object.keys(pg.CASE2_RAIN_CANON.evidence),people:[],flags:{qiulan_revealed:true,last_seen_account:true,landlord_admitted_edit:true,opening_seen:true},done:{},phase:'deduction',deduction:0,answers:[],focus:4,finished:false}));
  pg.Case2RainCanon.start();
  ok(!!pd.querySelector('[data-opt]'),'Case 2 resumes seeded deduction');
  readingRoundTrip(pg,pd,'.c2-tabs [data-view]','records','deduction','Case 2');
  ok(pd.querySelector('[data-view="scene"]').disabled&&parseFloat(pg.getComputedStyle(pd.querySelector('[data-view="scene"]')).opacity)<.6,'Case 2 paused navigation visibly disabled');
  ok(pd.body.textContent.includes('查證後按「推理」回到原題'),'Case 2 record page explains paused navigation');
  ok(pd.activeElement===pd.querySelector('[data-view="records"]'),'Case 2 restored tab keeps keyboard focus');
  storage.setItem('mist-taiwan-rain-canon-v1',secondSave);probe.remove();
  // Start Case 3 through the original title entry (the fixture uses element.click).
  q('#casePickerSelect').value='case3';click('#casePickerGo');
  await waitFor(()=>q('[data-opening-next]'));
  var result=runFlow();
  if(!result.ok)throw new Error(result.text);
  // Reload through the real entry point and confirm the finished save resumes.
  await new Promise(resolve=>{frame.onload=resolve;game.location.reload()});
  game=frame.contentWindow;doc=frame.contentDocument;
  await waitFor(()=>q('#casePickerSelect'));
  q('#casePickerSelect').value='case3';click('#casePickerGo');
  await waitFor(()=>q('.c3-ending-name'));
  ok(q('.c3-ending-name').textContent.includes('證據邊界'),'production reload resumes correct ending');
  ok(!!q('#c3Home'),'ending exposes return to title');
  document.getElementById('result').textContent=out.join('\n');
  document.title='PASS Case3 Production Smoke';
 }catch(error){document.getElementById('result').textContent=out.join('\n')+'\nFAIL '+error.message;document.title='FAIL Case3 Production Smoke'}
})();
</script></body></html>
