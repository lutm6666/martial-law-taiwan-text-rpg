<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">雨夜中的林宅與臺北巷道</title>
<desc id="desc">1958年臺北雨夜，昏黃燈光照著老木門、黃符、積水與狹窄巷道。</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1118"/><stop offset="1" stop-color="#1d211d"/></linearGradient>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2c2a23"/><stop offset="1" stop-color="#171815"/></linearGradient>
  <linearGradient id="door" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#302319"/><stop offset=".55" stop-color="#1f1813"/><stop offset="1" stop-color="#130f0d"/></linearGradient>
  <linearGradient id="street" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#161a19"/><stop offset="1" stop-color="#080a0a"/></linearGradient>
  <radialGradient id="lamp" cx="50%" cy="50%" r="50%"><stop stop-color="#ffd998" stop-opacity=".95"/><stop offset=".25" stop-color="#d69d4a" stop-opacity=".5"/><stop offset="1" stop-color="#9b5f22" stop-opacity="0"/></radialGradient>
  <linearGradient id="puddle" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#141b1d"/><stop offset=".5" stop-color="#7a6643"/><stop offset="1" stop-color="#0c1113"/></linearGradient>
  <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="3" seed="7"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .08"/></feComponentTransfer></filter>
</defs>
