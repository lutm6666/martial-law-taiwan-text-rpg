</g>
<g opacity=".4" stroke="#c4a36a" fill="none">
  <path d="M140 668c90-26 180-12 265 4"/><path d="M555 705c135-26 260-22 390 8"/><path d="M760 752c100-18 210-13 310 6"/>
</g>
<g fill="#10110f" opacity=".86">
