<rect x="0" y="0" width="650" height="610" fill="url(#wall)"/>
<polygon points="650,80 1200,20 1200,610 650,610" fill="#111512"/>
<polygon points="0,610 1200,570 1200,800 0,800" fill="url(#street)"/>
<ellipse cx="780" cy="670" rx="270" ry="50" fill="url(#puddle)" opacity=".8"/>
<ellipse cx="960" cy="735" rx="190" ry="35" fill="#725738" opacity=".18"/>
