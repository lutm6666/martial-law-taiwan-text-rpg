name: AI task
description: 建立後自動規劃路由與 draft PR；具寫入權限者的 Issue 會啟動 AI 實作
title: "[AI] "
body:
  - type: dropdown
    id: workstream
    attributes:
      label: Workstream
      description: 路由提示；標題與內容也會參與規劃，PR 的實際檔案路徑決定 review 與 owner gate。
      options:
        - Canon / Logic / State / Tests
        - Frontend / UI / Responsive / Accessibility
        - Art / Assets
        - Tests / Validators / Docs
        - Mixed / Cross-boundary
        - Repository admin / Settings
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: 完成後應該具備什麼行為？
      placeholder: 清楚描述完成條件。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Relevant files / scope
      description: 已知檔案、案件、場景或模組。
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: 可驗證的完成條件，每行一項。
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints / Canon notes
      description: 不可改動的規則、防劇透條件或相容性要求。
