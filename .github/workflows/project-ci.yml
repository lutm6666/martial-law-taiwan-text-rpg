name: Project validation

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project_validate:
    name: project-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify runtime JavaScript
        run: |
          node --check case1-unified-engine.js
          node --check case2-engine.js
          node --check case2-rain-canon.js
          node --check case2-rain-canon-engine.js
          node tools/verify-javascript.js

      - name: Verify canonical assets
        run: |
          test -f assets/case1/tea.webp
          test -f assets/case1/print.webp
          test -f assets/case1/market.webp
          test -f assets/case1/bookstall.webp
          test -f assets/case1/failed.webp
          test "$(find assets/case1 -maxdepth 1 -type f -name 'evidence*.png' | wc -l)" -eq 7
          test "$(find assets/v2/canon -maxdepth 1 -type f -name 'e*.png' | wc -l)" -eq 12
          test "$(find assets/v2/canon -maxdepth 1 -type f -name '0[1-7]_*.png' | wc -l)" -eq 7

      - name: Detect Case 3 changes
        id: case3
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
          elif [ -n "${PUSH_BEFORE:-}" ] && ! echo "$PUSH_BEFORE" | grep -q '^0000000000000000000000000000000000000000$'; then
            BASE="$PUSH_BEFORE"
          else
            BASE="$(git rev-parse HEAD^)"
          fi
          git diff --name-only "$BASE" "$GITHUB_SHA" > /tmp/changed.txt
          if grep -Eq '^(case3-|CASE3_|tools/(test-case3|validate-case3|case3-browser-smoke)|\.github/workflows/case3-ci\.yml)' /tmp/changed.txt; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Case 3
        if: steps.case3.outputs.changed == 'true'
        run: |
          node --check case3-film-canon.js
          node --check case3-film-engine.js
          node --check case3-film-ui.js
          node --check case3-art-manifest.js
          node --check tools/test-case3-engine.js
          node --check tools/validate-case3.js
          node tools/validate-case3.js
          node tools/test-case3-engine.js

      - name: Case 3 browser smoke playthrough
        if: steps.case3.outputs.changed == 'true'
        run: |
          node -e "const http=require('http'),fs=require('fs'),path=require('path');http.createServer((req,res)=>{const p=path.join(process.cwd(),req.url==='/'?'tools/case3-browser-smoke.html':req.url.slice(1));fs.readFile(p,(e,d)=>{if(e){res.statusCode=404;return res.end('not found')}res.end(d)})}).listen(8765,'127.0.0.1')" >/tmp/case3-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --dump-dom http://127.0.0.1:8765/tools/case3-browser-smoke.html > /tmp/case3-smoke-dom.html
          grep -q "PASS FULL BROWSER FLOW" /tmp/case3-smoke-dom.html
