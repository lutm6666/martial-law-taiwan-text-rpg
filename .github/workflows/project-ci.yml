name: Project validation

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  project_validate:
    name: project-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify AI workflow regressions
        run: |
          node --check tools/ai-workflow.js
          node --check tools/ai-workflow.routing.js
          node --check tools/ai-workflow.dispatch.js
          node --check tools/ai-workflow.publish.js
          node --check tools/ai-workflow.secret-scan.js
          node --check tools/ai-workflow.identity.js
          node --check tools/ai-workflow.review.js
          node --check tools/ai-workflow.claude-review.js
          node --check tools/ai-workflow.review-completion.js
          node --check tools/ai-path-guard.approval.js
          node --check tools/ai-path-guard.runtime.js
          node --check tools/test-ai-workflow.owner-approval.js
          node --check tools/test-ai-workflow.routing.js
          node --check tools/test-ai-workflow.dispatch.js
          node --check tools/test-ai-workflow.dispatch-recovery.js
          node --check tools/test-ai-workflow.dispatch-contract.js
          node --check tools/test-ai-workflow.publish.js
          node --check tools/test-ai-workflow.secret-scan.js
          node --check tools/test-ai-workflow.guard-contract.js
          node --check tools/test-ai-workflow.review.js
          node --check tools/test-ai-workflow.review-completion.js
          node --check tools/test-ai-workflow.claude-review.js
          node --check tools/test-ai-workflow.workflow-contract.js
          node --check tools/ai-orchestrator.js
          node --check tools/test-ai-orchestrator.js
          node tools/test-ai-workflow.js
          node tools/test-ai-workflow.routing.js
          node tools/test-ai-workflow.dispatch.js
          node tools/test-ai-workflow.dispatch-recovery.js
          node tools/test-ai-workflow.dispatch-contract.js
          node tools/test-ai-workflow.publish.js
          node tools/test-ai-workflow.secret-scan.js
          node --test tools/test-ai-workflow.owner-approval.js
          node tools/test-ai-workflow.guard-contract.js
          node tools/test-ai-workflow.review.js
          node tools/test-ai-workflow.review-completion.js
          node --test tools/test-ai-workflow.claude-review.js
          node tools/test-ai-workflow.workflow-contract.js
          node tools/test-ai-orchestrator.js
          node tools/ai-orchestrator.js validate .ai/orchestration.example.json

      - name: Verify runtime JavaScript
        run: |
          node --check case1-unified-engine.js
          node --check case2-engine.js
          node --check case2-rain-canon.js
          node --check case2-rain-canon-engine.js
          node tools/verify-javascript.js

      - name: Verify canonical assets
        run: |
          test -f assets/case1/tea.webp
          test -f assets/case1/print.webp
          test -f assets/case1/market.webp
          test -f assets/case1/bookstall.webp
          test -f assets/case1/failed.webp
          test "$(find assets/case1 -maxdepth 1 -type f -name 'evidence*.png' | wc -l)" -eq 7
          test "$(find assets/v2/canon -maxdepth 1 -type f -name 'e*.png' | wc -l)" -eq 12
          test "$(find assets/v2/canon -maxdepth 1 -type f -name '0[1-7]_*.png' | wc -l)" -eq 7

      - name: Verify production Pages bundle
        run: node tools/test-pages-bundle.js

      - name: Detect Case 3 changes
        id: case3
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
          elif [ -n "${PUSH_BEFORE:-}" ] && ! echo "$PUSH_BEFORE" | grep -q '^0000000000000000000000000000000000000000$'; then
            BASE="$PUSH_BEFORE"
          else
            BASE="$(git rev-parse HEAD^)"
          fi
          git diff --name-only "$BASE" "$GITHUB_SHA" > /tmp/changed.txt
          if grep -Eq '^(case3-|CASE3_|assets/case3/|tools/(test-case3|validate-case3|case3-browser-smoke)|\.github/workflows/case3-ci\.yml)' /tmp/changed.txt; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Case 3
        if: steps.case3.outputs.changed == 'true'
        run: |
          node --check case3-film-canon.js
          node --check case3-film-engine.js
          node --check case3-film-ui.js
          node --check case3-art-manifest.js
          node --check tools/test-case3-engine.js
          node --check tools/validate-case3.js
          node tools/validate-case3.js
          node tools/test-case3-engine.js

      - name: Case 3 browser smoke playthrough
        if: steps.case3.outputs.changed == 'true'
        run: |
          node -e "const http=require('http'),fs=require('fs'),path=require('path');http.createServer((req,res)=>{const p=path.join(process.cwd(),new URL(req.url,'http://localhost').pathname.slice(1)||'tools/case3-browser-smoke.html');fs.readFile(p,(e,d)=>{if(e){res.statusCode=404;return res.end('not found')}res.end(d)})}).listen(8765,'127.0.0.1')" >/tmp/case3-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME"
          "$CHROME" --headless=new --no-sandbox --disable-gpu --dump-dom http://127.0.0.1:8765/tools/case3-browser-smoke.html > /tmp/case3-smoke-dom.html
          grep -Fq '<title>PASS Case3 Browser Smoke</title>' /tmp/case3-smoke-dom.html
          for MODE in desktop mobile; do
            QUERY=""
            if [ "$MODE" = "mobile" ]; then QUERY="?mobile=1"; fi
            "$CHROME" --headless=new --no-sandbox --disable-gpu --virtual-time-budget=10000 --dump-dom "http://127.0.0.1:8765/tools/case3-production-smoke.html$QUERY" > "/tmp/case3-production-$MODE.html"
            grep -Fq '<title>PASS Case3 Production Smoke</title>' "/tmp/case3-production-$MODE.html"
          done

      - name: Case 3 WebKit desktop and iPhone emulation
        if: steps.case3.outputs.changed == 'true'
        run: |
          npm install --prefix "$RUNNER_TEMP/case3-browser" --no-audit --no-fund playwright@1.62.1
          node "$RUNNER_TEMP/case3-browser/node_modules/playwright/cli.js" install --with-deps webkit
          NODE_PATH="$RUNNER_TEMP/case3-browser/node_modules" node tools/test-case3-webkit.js
