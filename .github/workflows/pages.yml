name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Harden Case 2 save recovery and reset paths
        run: |
          python3 - <<'PY'
          from pathlib import Path

          engine_path = Path('case2-engine-core.js')
          engine = engine_path.read_text(encoding='utf-8')
          old_failed = "v.failed=v.finished?false:(!!v.failed||v.focus<=0);"
          new_failed = "v.failed=!v.finished&&v.focus<=0;"
          if old_failed in engine:
              engine = engine.replace(old_failed, new_failed, 1)
          elif new_failed not in engine:
              raise SystemExit('Case 2 failed-state normalization hook not found')

          old_reset_hooks = "wrapClear('startBtn');wrapClear('restartBtn');wrapClear('retryBtn');}"
          new_reset_hooks = "wrapClear('startBtn');wrapClear('restartBtn');wrapClear('retryBtn');wrapClear('failHomeBtn');wrapClear('homeBtn');}"
          if old_reset_hooks in engine:
              engine = engine.replace(old_reset_hooks, new_reset_hooks, 1)
          elif new_reset_hooks not in engine:
              raise SystemExit('Case 2 reset hooks not found')

          engine = engine.replace('BUILD 5.1.4', 'BUILD 5.1.6')
          engine_path.write_text(engine, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8').replace('BUILD 5.1.4', 'BUILD 5.1.6')
          index_path.write_text(index, encoding='utf-8')

          case2_tool = Path('tools/apply-case2.py')
          tool = case2_tool.read_text(encoding='utf-8')
          tool = tool.replace("BUILD = '5.1.4'", "BUILD = '5.1.6'")
          tool = tool.replace("v.failed=v.finished?false:(!!v.failed||v.focus<=0);", new_failed)
          tool = tool.replace('case2-engine.js?v=10', 'case2-engine.js?v=12')
          if 'old_reset_hooks = "wrapClear' not in tool:
              marker = "if engine != engine_original:\n    engine_path.write_text(engine, encoding='utf-8')\n"
              persistent = """# Any Case 1 action that explicitly resets that case must also clear a stale\n# downstream Case 2 save. Otherwise returning home after a failed/completed\n# Case 1 can leave the title screen offering an unrelated older Case 2 run.\nold_reset_hooks = \"wrapClear('startBtn');wrapClear('restartBtn');wrapClear('retryBtn');}\"\nnew_reset_hooks = \"wrapClear('startBtn');wrapClear('restartBtn');wrapClear('retryBtn');wrapClear('failHomeBtn');wrapClear('homeBtn');}\"\nif old_reset_hooks in engine:\n    engine = engine.replace(old_reset_hooks, new_reset_hooks, 1)\nelif new_reset_hooks not in engine:\n    raise SystemExit('case2: Case 1 reset hooks not found')\n\n"""
              if marker not in tool:
                  raise SystemExit('Case 2 generator persistence marker not found')
              tool = tool.replace(marker, persistent + marker, 1)
          case2_tool.write_text(tool, encoding='utf-8')

          save_tool = Path('tools/apply-save-route-fix.py')
          save = save_tool.read_text(encoding='utf-8')
          save = save.replace('BUILD 5.1.5・CASE 02', 'BUILD 5.1.6・CASE 02')
          save = save.replace("。BUILD 5.1.5'", "。BUILD 5.1.6'")
          save = save.replace('case2-engine.js?v=11', 'case2-engine.js?v=12')
          save_tool.write_text(save, encoding='utf-8')
          PY

      - name: Harden V2 expanded save recovery
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('v2-rain-engine.js')
          text = path.read_text(encoding='utf-8')
          if 'function normalize(v){' not in text:
              old = "function migrateOld(){var old=parse(OLD_SAVE_KEY);if(!old)return null;var n=fresh();var map={low_scratches:'door_marks',rain_channel:'rain_line',torn_talisman:'torn_talisman',small_print:'small_print',son_account:'son_account',neighbor_version:'neighbor_version',timing_gap:'timing_gap'};(old.evidence||[]).forEach(function(id){var m=map[id];if(m&&n.evidence.indexOf(m)<0)n.evidence.push(m)});return n}\nfunction load(){var v=parse(SAVE_KEY);if(!v||v.caseId!=='rain-ch1-v2')v=migrateOld();return v&&v.caseId==='rain-ch1-v2'?v:null}"
              new = "function migrateOld(){var old=parse(OLD_SAVE_KEY);if(!old)return null;var n=fresh();var map={low_scratches:'door_marks',rain_channel:'rain_line',torn_talisman:'torn_talisman',small_print:'small_print',son_account:'son_account',neighbor_version:'neighbor_version',timing_gap:'timing_gap'};var oldEvidence=Array.isArray(old.evidence)?old.evidence:[];oldEvidence.forEach(function(id){var m=map[id];if(m&&n.evidence.indexOf(m)<0)n.evidence.push(m)});return n}\nfunction normalize(v){if(!v||typeof v!=='object'||v.caseId!=='rain-ch1-v2')return null;var n=fresh(),validEvidence={},validActions={},actionById={};Object.keys(evidence).forEach(function(id){validEvidence[id]=true});Object.keys(locations).forEach(function(locId){locations[locId].actions.forEach(function(a){validActions[a.id]=true;actionById[a.id]=a})});n.name=typeof v.name==='string'&&v.name.trim()?v.name.trim():n.name;var f=Number(v.focus);n.focus=Number.isFinite(f)?Math.max(1,Math.min(MAX_FOCUS,Math.floor(f))):MAX_FOCUS;n.evidence=[];(Array.isArray(v.evidence)?v.evidence:[]).forEach(function(id){if(validEvidence[id]&&n.evidence.indexOf(id)<0)n.evidence.push(id)});function hasN(id){return n.evidence.indexOf(id)!==-1}n.done={};if(v.done&&typeof v.done==='object'){Object.keys(v.done).forEach(function(id){var a=actionById[id];if(!a||!v.done[id])return;if(a.requires&&!a.requires.every(hasN))return;if(a.gain&&!hasN(a.gain))return;n.done[id]=true})}n.visited={house:true};if(v.visited&&typeof v.visited==='object'){Object.keys(v.visited).forEach(function(id){var l=locations[id];if(!l||!v.visited[id])return;if(!l.lockedBy||l.lockedBy.every(hasN))n.visited[id]=true})}n.loc=typeof v.loc==='string'&&locations[v.loc]&&(!locations[v.loc].lockedBy||locations[v.loc].lockedBy.every(hasN))?v.loc:'house';n.visited[n.loc]=true;n.feedback=typeof v.feedback==='string'?v.feedback:'';var step=Number(v.deduction);n.deduction=Number.isFinite(step)?Math.max(0,Math.min(deductions.length,Math.floor(step))):0;n.answers=(Array.isArray(v.answers)?v.answers:[]).filter(function(x){return Number.isInteger(x)&&x>=0&&x<3}).slice(0,n.deduction);var core=['door_marks','rain_line','torn_talisman','talisman_age','client_timeline','son_account','umbrella_mud','small_print','nail_mark','son_excluded','neighbor_version','source_elder','bell_time','route_window','timing_gap'].every(hasN);n.finished=core&&n.deduction>=deductions.length;if(n.finished){n.phase='done';n.deduction=deductions.length}else if(v.phase==='deduction'&&core){n.phase='deduction'}else{n.phase='investigate';if(!core)n.deduction=0}return n}\nfunction load(){var v=parse(SAVE_KEY);if(!v||v.caseId!=='rain-ch1-v2')v=migrateOld();return normalize(v)}"
              if old not in text:
                  raise SystemExit('V2 save normalization hook not found')
              text = text.replace(old, new, 1)

          continuity_fixes = {
              "從雜貨店到林宅後巷最快仍需約四分鐘；第一夜的已知可疑人物沒有足夠時間完成往返。": "從雜貨店到林宅後巷最快仍需約四分鐘；若第一夜有人從街口出發並完成後巷往返，時間會非常吃緊。",
              "人為路線可以解釋部分敲門，但第一夜目前無法由同一名已知行動者完成。": "人為路線可以解釋部分敲門，但第一夜的外部時間點仍和完整往返所需時間對不上。",
              "如果把第一夜最可疑的人放在街口，他從鐘聲後離開、繞到後巷、製造敲門再回到原處，時間不夠。人為手法存在，但「同一個人解釋全部三夜」這個說法站不住。": "把第一夜的鐘聲時間和實際步行路線疊在一起後，若有人要從街口出發、繞到後巷製造敲門再返回，時間明顯不足。這表示第一夜不能直接套用目前觀察到的同一套往返路線。",
              "銅鈴時間與步行時間把第一夜卡住了：同一名已知行動者無法同時出現在兩處。": "銅鈴時間與步行時間把第一夜卡住了：目前已知的街口—後巷往返方式無法在這段時間內完成。"
          }
          for old_text, new_text in continuity_fixes.items():
              if old_text in text:
                  text = text.replace(old_text, new_text, 1)
              elif new_text not in text:
                  raise SystemExit('V2 continuity wording hook not found: ' + old_text)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Harden Case 1 save route recovery
        run: python3 tools/apply-save-route-fix.py

      - name: Persist runtime fix to main
        run: |
          if git diff --quiet -- index.html case2-engine-core.js tools/apply-case2.py tools/apply-save-route-fix.py v2-rain-engine.js; then
            echo "Runtime fix already persisted."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html case2-engine-core.js tools/apply-case2.py tools/apply-save-route-fix.py v2-rain-engine.js
            git commit -m "Persist runtime recovery fixes [skip ci]"
            git push origin HEAD:main
          fi

      - name: Stamp deployment cache keys
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          stamp = os.environ['GITHUB_SHA'][:12]
          asset_pattern = r'(assets/case1/(?:tea|print|market|bookstall|failed)\.webp)\?v=[^"\']+'

          for filename in ('index.html', 'case2-engine-core.js'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              text = re.sub(asset_pattern, rf'\1?v={stamp}', text)
              if filename == 'index.html':
                  text = re.sub(r'(case2-engine\.js)\?v=[^"\']+', rf'\1?v={stamp}', text)
              path.write_text(text, encoding='utf-8')

          wrapper_path = Path('case2-engine.js')
          wrapper = wrapper_path.read_text(encoding='utf-8')
          wrapper = re.sub(r'(image-lightbox\.js)\?v=[^"\']+', rf'\1?v={stamp}', wrapper)
          wrapper = re.sub(r'(case2-engine-core\.js)\?v=[^"\']+', rf'\1?v={stamp}', wrapper)
          wrapper_path.write_text(wrapper, encoding='utf-8')

          preview_path = Path('v2-preview.html')
          preview = preview_path.read_text(encoding='utf-8')
          preview = re.sub(r'(v2-rain-engine\.js)\?v=[^"\']+', rf'\1?v={stamp}', preview)
          preview_path.write_text(preview, encoding='utf-8')

          print(f'CACHE_STAMP {stamp}')
          PY

      - name: Validate JavaScript
        run: |
          node --check case2-engine.js
          node --check case2-engine-core.js
          node --check image-lightbox.js
          node --check v2-rain-engine.js
          node tools/verify-javascript.js

      - name: Install image verifier
        run: python3 -m pip install --disable-pip-version-check --quiet pillow

      - name: Verify production images decode
        run: python3 tools/verify-case1-images.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
