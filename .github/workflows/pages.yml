name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Harden Case 2 save recovery and reset paths
        run: |
          python3 - <<'PY'
          from pathlib import Path

          engine_path = Path('case2-engine.js')
          engine = engine_path.read_text(encoding='utf-8')
          old_failed = "v.failed=v.finished?false:(!!v.failed||v.focus<=0);"
          new_failed = "v.failed=!v.finished&&v.focus<=0;"
          if old_failed in engine:
              engine = engine.replace(old_failed, new_failed, 1)
          elif new_failed not in engine:
              raise SystemExit('Case 2 failed-state normalization hook not found')

          old_reset_hooks = "wrapClear('startBtn');wrapClear('restartBtn');wrapClear('retryBtn');}"
          new_reset_hooks = "wrapClear('startBtn');wrapClear('restartBtn');wrapClear('retryBtn');wrapClear('failHomeBtn');wrapClear('homeBtn');}"
          if old_reset_hooks in engine:
              engine = engine.replace(old_reset_hooks, new_reset_hooks, 1)
          elif new_reset_hooks not in engine:
              raise SystemExit('Case 2 reset hooks not found')

          engine = engine.replace('BUILD 5.1.4', 'BUILD 5.1.6')
          engine_path.write_text(engine, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8').replace('BUILD 5.1.4', 'BUILD 5.1.6')
          index_path.write_text(index, encoding='utf-8')

          # Keep generator sources synchronized so a later maintenance run
          # cannot restore stale save rules, reset hooks, or an older build label.
          case2_tool = Path('tools/apply-case2.py')
          tool = case2_tool.read_text(encoding='utf-8')
          tool = tool.replace("BUILD = '5.1.4'", "BUILD = '5.1.6'")
          tool = tool.replace("v.failed=v.finished?false:(!!v.failed||v.focus<=0);", new_failed)
          tool = tool.replace('case2-engine.js?v=10', 'case2-engine.js?v=12')
          if 'old_reset_hooks = "wrapClear' not in tool:
              marker = "if engine != engine_original:\n    engine_path.write_text(engine, encoding='utf-8')\n"
              persistent = """# Any Case 1 action that explicitly resets that case must also clear a stale\n# downstream Case 2 save. Otherwise returning home after a failed/completed\n# Case 1 can leave the title screen offering an unrelated older Case 2 run.\nold_reset_hooks = \"wrapClear('startBtn');wrapClear('restartBtn');wrapClear('retryBtn');}\"\nnew_reset_hooks = \"wrapClear('startBtn');wrapClear('restartBtn');wrapClear('retryBtn');wrapClear('failHomeBtn');wrapClear('homeBtn');}\"\nif old_reset_hooks in engine:\n    engine = engine.replace(old_reset_hooks, new_reset_hooks, 1)\nelif new_reset_hooks not in engine:\n    raise SystemExit('case2: Case 1 reset hooks not found')\n\n"""
              if marker not in tool:
                  raise SystemExit('Case 2 generator persistence marker not found')
              tool = tool.replace(marker, persistent + marker, 1)
          case2_tool.write_text(tool, encoding='utf-8')

          save_tool = Path('tools/apply-save-route-fix.py')
          save = save_tool.read_text(encoding='utf-8')
          save = save.replace('BUILD 5.1.5・CASE 02', 'BUILD 5.1.6・CASE 02')
          save = save.replace("。BUILD 5.1.5'", "。BUILD 5.1.6'")
          save = save.replace('case2-engine.js?v=11', 'case2-engine.js?v=12')
          save_tool.write_text(save, encoding='utf-8')
          PY

      - name: Persist runtime fix to main
        run: |
          if git diff --quiet -- index.html case2-engine.js tools/apply-case2.py tools/apply-save-route-fix.py; then
            echo "Runtime fix already persisted."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html case2-engine.js tools/apply-case2.py tools/apply-save-route-fix.py
            git commit -m "Persist Case 2 reset-path save fix [skip ci]"
            git push origin HEAD:main
          fi

      - name: Stamp deployment cache keys
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          stamp = os.environ['GITHUB_SHA'][:12]
          asset_pattern = r'(assets/case1/(?:tea|print|market|bookstall|failed)\.webp)\?v=[^"\']+'

          for filename in ('index.html', 'case2-engine.js'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              text = re.sub(asset_pattern, rf'\1?v={stamp}', text)
              if filename == 'index.html':
                  text = re.sub(r'(case2-engine\.js)\?v=[^"\']+', rf'\1?v={stamp}', text)
              path.write_text(text, encoding='utf-8')

          print(f'CACHE_STAMP {stamp}')
          PY

      - name: Validate JavaScript
        run: |
          node --check case2-engine.js
          node tools/verify-javascript.js

      - name: Install image verifier
        run: python3 -m pip install --disable-pip-version-check --quiet pillow

      - name: Verify production images decode
        run: python3 tools/verify-case1-images.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4