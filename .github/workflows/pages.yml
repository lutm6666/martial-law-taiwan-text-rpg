name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Stamp deployment cache keys
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import re

          stamp = os.environ['GITHUB_SHA'][:12]
          asset_pattern = r'(assets/case1/(?:tea|print|market|bookstall|failed)\.webp)\?v=[^"\']+'

          for filename in ('index.html', 'case2-engine.js'):
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              text = re.sub(asset_pattern, rf'\1?v={stamp}', text)
              if filename == 'index.html':
                  text = re.sub(r'(case2-engine\.js)\?v=[^"\']+', rf'\1?v={stamp}', text)
              path.write_text(text, encoding='utf-8')

          print(f'CACHE_STAMP {stamp}')
          PY

      - name: Validate JavaScript
        run: |
          node --check case2-engine.js
          node tools/verify-javascript.js

      - name: Install image verifier
        run: python3 -m pip install --disable-pip-version-check --quiet pillow

      - name: Verify production images decode
        run: python3 tools/verify-case1-images.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
