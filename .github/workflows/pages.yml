name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply production hotfix
        run: python3 tools/apply-pages-hotfix.py

      - name: Apply role save debug fix
        run: python3 tools/debug-role-save-fix.py

      - name: Apply save route fix
        run: python3 tools/apply-save-route-fix.py

      - name: Apply discovery visibility cleanup
        run: python3 tools/apply-discovery-visibility.py

      - name: Apply Case 1 visual clues
        run: python3 tools/apply-case1-visuals.py

      - name: Apply visual polish
        run: python3 tools/apply-visual-polish.py

      - name: Rebuild Case 1 HQ images
        run: |
          if python3 tools/rebuild-case1-images.py; then
            echo "HQ image rebuild completed."
          else
            echo "::warning::HQ image source rebuild failed; validating and using committed fallback assets."
            python3 - <<'PY'
          from pathlib import Path
          names = ('tea', 'print', 'market', 'bookstall', 'failed')
          for name in names:
              p = Path('assets/case1') / f'{name}.webp'
              data = p.read_bytes() if p.exists() else b''
              if len(data) < 1024 or data[:4] != b'RIFF' or data[8:12] != b'WEBP':
                  raise SystemExit(f'Missing or invalid fallback WebP: {p}')
              print(f'FALLBACK_IMAGE {name}: {len(data)} bytes')
          PY
          fi

      - name: Persist hotfix to main
        run: |
          if git diff --quiet -- index.html; then
            echo "No index hotfix changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Apply production case hotfix [skip ci]"
            git push origin HEAD:main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
