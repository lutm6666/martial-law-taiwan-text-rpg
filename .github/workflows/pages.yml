name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply production hotfix
        run: python3 tools/apply-pages-hotfix.py

      - name: Apply role save debug fix
        run: python3 tools/debug-role-save-fix.py

      - name: Apply save route fix
        run: python3 tools/apply-save-route-fix.py

      - name: Apply discovery visibility cleanup
        run: python3 tools/apply-discovery-visibility.py

      - name: Apply Case 1 visual clues
        run: python3 tools/apply-case1-visuals.py

      - name: Apply visual polish
        run: python3 tools/apply-visual-polish.py

      - name: Apply Case 2 engine
        run: python3 tools/apply-case2.py

      - name: Apply Case 2 testimony and recap polish
        run: python3 tools/apply-case2-polish.py

      - name: Switch production images to inline assets
        run: python3 tools/apply-inline-case1-art.py

      - name: Validate JavaScript
        run: |
          node --check case1-art-tea.js
          node --check case1-art-print.js
          node --check case1-art-market.js
          node --check case1-art-bookstall.js
          node --check case1-art-failed.js
          node --check case2-engine.js

      - name: Install image verifier
        run: python3 -m pip install --disable-pip-version-check --quiet pillow

      - name: Verify production images decode
        run: python3 tools/verify-inline-case1-art.py

      - name: Persist production patches to main
        run: |
          if git diff --quiet -- index.html case2-engine.js; then
            echo "No production patch changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html case2-engine.js
            git commit -m "Persist inline Case 1 image fix [skip ci]"
            git push origin HEAD:main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
