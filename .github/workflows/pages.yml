name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply production hotfix
        run: python3 tools/apply-pages-hotfix.py

      - name: Apply role save debug fix
        run: python3 tools/debug-role-save-fix.py

      - name: Apply save route fix
        run: python3 tools/apply-save-route-fix.py

      - name: Apply discovery visibility cleanup
        run: python3 tools/apply-discovery-visibility.py

      - name: Persist hotfix to main
        run: |
          if git diff --quiet -- index.html; then
            echo "No index hotfix changes to commit."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Apply production case hotfix [skip ci]"
            git push origin HEAD:main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
