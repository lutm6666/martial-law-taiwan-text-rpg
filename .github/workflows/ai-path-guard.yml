name: AI Path Guard

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4

      - name: Collect PR routing and changed files
        id: classify
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const pr=context.payload.pull_request;
            const labels=(pr.labels||[]).map(x=>x.name);
            const ref=pr.head.ref||'';
            let agent='human';
            if(labels.includes('ai:claude') || /^claude\//.test(ref) || /^ai\/claude-/.test(ref)) agent='claude';
            else if(labels.includes('ai:codex') || /^codex\//.test(ref) || /^ai\/codex-/.test(ref)) agent='codex';
            else if(labels.includes('ai:handoff') || /^handoff\//.test(ref)) agent='handoff';

            const files=await github.paginate(github.rest.pulls.listFiles,{
              owner:context.repo.owner,repo:context.repo.repo,pull_number:pr.number,per_page:100
            });
            fs.writeFileSync('changed-files.txt',files.map(f=>f.filename).join('\n')+'\n');
            core.setOutput('agent',agent);

      - name: Enforce ownership boundary
        env:
          AI_AGENT: ${{ steps.classify.outputs.agent }}
        run: |
          export AI_CHANGED_FILES="$(cat changed-files.txt)"
          node tools/ai-path-guard.js
