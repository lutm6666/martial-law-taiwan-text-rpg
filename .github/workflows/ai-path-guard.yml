name: AI Path Guard
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, labeled, unlabeled, edited]
  issue_comment:
    types: [created, edited, deleted]
permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: write
  actions: write
concurrency:
  group: ai-path-guard-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false
jobs:
  guard:
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    runs-on: ubuntu-latest
    steps:
      - name: Resolve current trusted base
        id: base
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.payload.pull_request?.number || context.payload.issue.number;
            const {data: pr} = await github.rest.pulls.get({...context.repo, pull_number: number});
            const {data: repo} = await github.rest.repos.get(context.repo);
            if (pr.state !== 'open' || pr.base.ref !== repo.default_branch) {
              core.info('Only open PRs targeting the default branch are guarded.');
              return;
            }
            core.setOutput('number', number);
            core.setOutput('sha', pr.base.sha);
      - name: Checkout trusted policy only
        if: steps.base.outputs.sha != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.base.outputs.sha }}
          path: trusted
          persist-credentials: false
      - name: Publish required guard on current PR head
        if: steps.base.outputs.sha != ''
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.base.outputs.number }}
          TRUSTED_BASE_SHA: ${{ steps.base.outputs.sha }}
        with:
          script: |
            await require('./trusted/tools/ai-path-guard.runtime.js').runGuard({
              github, context, core, number: Number(process.env.PR_NUMBER),
              expectedBaseSha: process.env.TRUSTED_BASE_SHA
            });
