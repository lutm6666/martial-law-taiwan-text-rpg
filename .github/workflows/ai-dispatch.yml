name: AI Dispatch
on:
  issues:
    types: [opened, reopened, edited, labeled]
permissions:
  contents: read
  issues: write
concurrency:
  group: ai-dispatch-${{ github.event.issue.number }}
  cancel-in-progress: false
jobs:
  dispatch:
    if: github.event.action != 'labeled' || github.event.label.name == 'dispatch:ready' || github.event.label.name == 'dispatch:retry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            await require('./tools/ai-workflow.js').dispatch({github, context, core});
